version: "3.9"
name: microservices-demo

services:
  database:
    image: mongo:latest
    volumes:
      - mongodb-volume:/data/db
    restart: always
    ports:
      - "27017:27017"

  server:
    build: ./server
    environment:
      PORT: 5000
      MONGODB_URL: mongodb://database:27017
    restart: always
    depends_on:
      - database
    ports:
      - "5000:5000"

  client:
    build: ./client
    environment:
      REACT_APP_API_URL: http://localhost:5000
    restart: always
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  mongodb-volume:
    external: false